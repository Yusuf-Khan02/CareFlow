# ==============================================================================
# CareFlow Smart Hospital Operations Platform - Docker Compose
# Orchestrates: Frontend (Nginx), Backend API (Node.js/Prisma), Redis (BullMQ)
# ==============================================================================

version: "3.8"

services:
  # ----------------------------------------------------------------------------
  # 1. Frontend Web Client (React + TypeScript + Vite + Nginx)
  # ----------------------------------------------------------------------------
  frontend:
    build:
      context: ./CareFlowFrontend
      dockerfile: Dockerfile
    container_name: careflow-frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "5173:80" # Optional port map matching local Vite development port
    depends_on:
      server:
        condition: service_healthy
    networks:
      - careflow_network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ----------------------------------------------------------------------------
  # 2. Backend REST API & Real-Time Engine (Express + TypeScript + Socket.IO)
  # ----------------------------------------------------------------------------
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: careflow-server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATABASE_URL=file:/app/prisma/dev.db
      - REDIS_URL=redis://redis:6379
      - CORS_ORIGIN=http://localhost,http://localhost:80,http://localhost:5173
      - JWT_SECRET=careflow_prod_demo_secret_2026_change_in_production
      - JWT_REFRESH_SECRET=careflow_prod_refresh_secret_2026_change_in_production
      - AUTO_SEED=true
    volumes:
      - careflow_db:/app/prisma
      - careflow_storage:/app/storage/private
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - careflow_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/v1/health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ----------------------------------------------------------------------------
  # 3. Redis Service (Background Job Queues, Caching, BullMQ)
  # ----------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: careflow-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - careflow_redis:/data
    networks:
      - careflow_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ----------------------------------------------------------------------------
  # 4. Optional PostgreSQL Database (Activate with: --profile postgres)
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: careflow-postgres
    profiles:
      - postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: careflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: careflow_postgres_password_2026
    ports:
      - "5432:5432"
    volumes:
      - careflow_postgres:/var/lib/postgresql/data
    networks:
      - careflow_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d careflow"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

# ------------------------------------------------------------------------------
# Persistent Storage Volumes & Isolated Internal Network
# ------------------------------------------------------------------------------
volumes:
  careflow_db:
    name: careflow_db_volume
  careflow_storage:
    name: careflow_storage_volume
  careflow_redis:
    name: careflow_redis_volume
  careflow_postgres:
    name: careflow_postgres_volume

networks:
  careflow_network:
    name: careflow_network
    driver: bridge
