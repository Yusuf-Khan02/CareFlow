name: CareFlow CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ----------------------------------------------------------------------------
  # 1. Backend Verification & Testing
  # ----------------------------------------------------------------------------
  backend:
    name: Backend Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    defaults:
      run:
        working-directory: server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client & Push Schema
        run: |
          npx prisma generate
          npx prisma db push --skip-generate
        env:
          DATABASE_URL: "file:./ci.db"

      - name: Seed Synthetic Clinical Database
        run: npx tsx prisma/seed.ts
        env:
          DATABASE_URL: "file:./ci.db"

      - name: Run Backend Unit & Integration Tests (34 suites)
        run: npm test
        env:
          DATABASE_URL: "file:./ci.db"
          JWT_SECRET: "ci_test_secret_key_careflow_2026"
          NODE_ENV: "test"

      - name: Build TypeScript Production Bundle
        run: npm run build

  # ----------------------------------------------------------------------------
  # 2. Frontend Client Verification & Testing
  # ----------------------------------------------------------------------------
  frontend:
    name: Frontend Test & Build (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20.x, 22.x]

    defaults:
      run:
        working-directory: CareFlowFrontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"
          cache-dependency-path: CareFlowFrontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Frontend Client Core Tests
        run: npm test

      - name: Build Production Vite Bundle
        run: npm run build

  # ----------------------------------------------------------------------------
  # 3. Docker Compose Configuration Validation
  # ----------------------------------------------------------------------------
  docker-validate:
    name: Docker Configuration Validation
    needs: [backend, frontend]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: docker compose config
